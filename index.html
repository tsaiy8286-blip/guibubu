<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>龜卜卜線上求卦</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="images/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="sky" aria-hidden="true"></canvas>
  <div class="sky-vignette" aria-hidden="true"></div>
  <div class="page">
    <header class="site-header">
      <div class="brand">
        <h1 class="site-title">龜卜卜線上求卦</h1>
        <span class="seal" aria-hidden="true">易</span>
      </div>
      <p class="tagline">觀象・知時・自省</p>
      <div class="header-rule" aria-hidden="true"></div>
    </header>

    <main class="site-main">
      <section class="panel cast-info" id="cast-info">
        <h2 class="panel-title"><span class="step" aria-hidden="true">一</span>起卦資訊</h2>

        <div class="field">
          <label class="field-label" for="cast-time">時間</label>
          <div class="time-row">
            <input class="input" type="datetime-local" id="cast-time">
            <button class="btn btn-small" type="button" id="fill-now">填入現在時間</button>
          </div>
        </div>

        <div class="field">
          <label class="field-label" for="cast-category">問事類別</label>
          <select class="input" id="cast-category">
            <option value="">請選擇</option>
            <option>工作</option>
            <option>財運</option>
            <option>經商</option>
            <option>感情</option>
            <option>家庭</option>
            <option>健康</option>
            <option>學業</option>
            <option>官司</option>
            <option>交友</option>
            <option>尋人(物)</option>
            <option>其他</option>
          </select>
        </div>

        <div class="field">
          <label class="field-label" for="cast-question">問事內容</label>
          <textarea class="input input-multiline" id="cast-question" rows="3" placeholder="這次面試能否錄取？"></textarea>
        </div>

        <button class="btn btn-primary btn-block" type="button" id="start-cast" disabled>開始擲卦</button>
      </section>

      <section class="summary" id="summary" hidden>
        <div class="summary-text">
          <span id="summary-time"></span>
          <span class="summary-tag" id="summary-category"></span>
          <span class="summary-question" id="summary-question"></span>
        </div>
        <button class="btn btn-small" type="button" id="edit-info">修改</button>
      </section>

      <section class="panel throw-area" id="throw-area" hidden>
        <h2 class="panel-title"><span class="step" aria-hidden="true">二</span><span id="throw-title">第 1 擲（初爻）</span></h2>

        <div class="throw-buttons" id="throw-buttons">
          <button class="throw-btn" type="button" data-backs="0">3正面<span class="coins" aria-hidden="true"></span></button>
          <button class="throw-btn" type="button" data-backs="1">2正面<span class="coins" aria-hidden="true"></span></button>
          <button class="throw-btn" type="button" data-backs="2">1正面<span class="coins" aria-hidden="true"></span></button>
          <button class="throw-btn" type="button" data-backs="3">3背面<span class="coins" aria-hidden="true"></span></button>
        </div>

        <div class="coin-note" id="coin-note">
          <p>備註：錢幣正面與反面判別方式如下：</p>
          <ul>
            <li><strong>正面</strong>：鑄有漢字「乾隆通寶」之一面，或硬幣的「人頭面」。</li>
            <li><strong>反面</strong>：鑄有「數字」之一面，或無漢字（僅有滿文／圖騰）之一面。</li>
          </ul>
        </div>

        <ol class="hexagram-log" id="hexagram-log"></ol>

        <button class="btn btn-block" type="button" id="undo-throw" disabled>退回上一步</button>
      </section>

      <div id="result-area" hidden>
        <section class="panel result">
          <h2 class="panel-title"><span class="step" aria-hidden="true">三</span>卦象</h2>

          <div class="result-figures" id="result-figures">
            <div class="figure-col">
              <p class="figure-name" id="figure-primary-name"></p>
              <ol class="figure figure-primary" id="figure-primary"></ol>
            </div>
            <span class="figure-arrow" id="figure-arrow" aria-hidden="true">→</span>
            <div class="figure-col" id="figure-changed-col">
              <p class="figure-name" id="figure-changed-name"></p>
              <ol class="figure figure-changed" id="figure-changed"></ol>
            </div>
          </div>

          <div class="hex-cards" id="hex-cards">
            <figure class="hex-card-col">
              <button class="hex-card" type="button" id="card-primary"><img alt=""></button>
              <figcaption>本卦</figcaption>
            </figure>
            <span class="hex-arrow" id="card-arrow" aria-hidden="true">→</span>
            <figure class="hex-card-col" id="card-changed-col">
              <button class="hex-card is-mirror" type="button" id="card-changed"><img alt=""><img class="hex-flip" alt=""></button>
              <figcaption>變卦</figcaption>
            </figure>
          </div>
          <p class="hex-hint">點牌卡可放大</p>

          <div class="field insight">
            <label class="field-label" for="insight">我的啟發（60 字以內，會印在紀念圖上；可留空）</label>
            <textarea class="input input-multiline" id="insight" rows="3" maxlength="60" placeholder="例如：腳步被卡住，不是因為你無能，而是這條路暫時通不過；強行硬衝只會耗損，轉向求助或蹲下累積，才能把一時的阻礙轉成長久的穩定。"></textarea>
            <p class="insight-count" id="insight-count" aria-live="polite">0 / 60</p>
          </div>
          <button class="btn btn-keep" type="button" id="download-keepsake">⬇ 下載紀念圖</button>

          <p class="result-zhande" id="result-zhande"></p>
          <p class="result-quiet" id="result-quiet">六爻安靜，無變卦</p>

          <div class="result-gua">
            <p class="gua-name" id="primary-name"></p>
            <blockquote class="gua-judgment" id="primary-judgment"></blockquote>
          </div>

          <div class="result-gua" id="changed-block">
            <p class="gua-name" id="changed-name"></p>
            <blockquote class="gua-judgment" id="changed-judgment"></blockquote>
          </div>

          <p class="result-moving" id="result-moving"></p>
        </section>

        <section class="panel copy-area">
          <h2 class="panel-title"><span class="step" aria-hidden="true">四</span>保存</h2>
          <button class="btn btn-primary btn-block" type="button" id="copy-note">複製到 Obsidian</button>
          <button class="btn btn-block" type="button" id="copy-prompt">複製 AI 解卦提示詞</button>
          <p class="copy-fail" id="copy-fail" hidden>無法自動複製，請展開下方預覽，長按選取文字複製</p>

          <details class="note-preview" id="note-preview">
            <summary>預覽筆記內容</summary>
            <pre id="note-text"></pre>
          </details>

          <button class="btn btn-block" type="button" id="new-cast">再起一卦</button>
        </section>
      </div>
    </main>
  </div>

  <div class="card-zoom" id="card-zoom" role="dialog" aria-modal="true" aria-label="牌卡放大檢視" hidden>
    <button class="hex-card" type="button" id="card-zoom-card" aria-label="關閉放大檢視"><img alt=""><img class="hex-flip" alt=""></button>
  </div>

  <script src="js/data.js"></script>
  <script src="js/yao.js"></script>
  <script src="js/prompt.js"></script>
  <script src="js/keepsake.js"></script>
  <script src="js/app.js"></script>
  <script src="js/sky.js"></script>
</body>
</html>
